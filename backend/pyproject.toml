[project]
name = "enterprise-rag-backend"
version = "0.1.0"
description = "Enterprise Agentic RAG Backend — FastAPI + LangGraph + Qdrant Hybrid Search"
requires-python = ">=3.11"

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",

    # --- LLM & Orchestration ---
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",

    # --- Vector Store ---
    "qdrant-client>=1.11.0",

    # --- Embeddings & Reranking ---
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",

    # --- Document Parsing ---
    "unstructured[pdf,md,csv]>=0.15.0",
    "python-docx>=1.1.0",

    # --- Utilities ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]
eval = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
